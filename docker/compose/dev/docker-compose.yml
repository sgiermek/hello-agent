services:
  hello-agent:
    image: ghcr.io/sgiermek/hello-agent:${IMAGE_TAG:-dev-latest}
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      APP_ENV: dev
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
